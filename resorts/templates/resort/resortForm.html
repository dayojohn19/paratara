{% load static %}
{% block body %}
<!-- CSS only -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
<link href="{% static 'bootstrap/assets/dist/css/bootstrap.min.css' %}" rel="stylesheet" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root {
    /* Brand */
    --brand-900: #0f1d33;
    --brand-800: #16294a;
    --brand-700: #1e3a5f;
    --brand-600: #2c4f7c;

    /* Accent */
    --gold: #d4af37;
    --gold-dark: #b8941f;
    --gold-light: #f0d98a;
    --gold-tint: #fffbef;

    /* Neutrals */
    --ink: #0f172a;
    --ink-2: #334155;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --page: #eef2f7;

    /* Status */
    --danger: #dc2626;

    /* Radius */
    --r-sm: 8px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 20px;

    /* Shadow */
    --sh-sm: 0 1px 2px rgba(15, 23, 42, .06);
    --sh-md: 0 4px 14px rgba(15, 23, 42, .08);
    --sh-lg: 0 18px 40px -12px rgba(15, 23, 42, .18);
  }

  /* ============================================================
     BASE
     ============================================================ */
  *,
  *::before,
  *::after { box-sizing: border-box; }

  html { font-size: 16px; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 2.5rem 1rem 4rem;
    background: var(--page);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                 'Helvetica Neue', Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================================
     CARD
     ============================================================ */
  .form-container {
    max-width: 860px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-xl);
    box-shadow: var(--sh-lg);
    overflow: hidden;
  }

  /* ============================================================
     HEADER
     ============================================================ */
  .form-header {
    position: relative;
    padding: 2.25rem 2.5rem 2rem;
    text-align: center;
    color: #fff;
    background: linear-gradient(135deg, var(--brand-700) 0%, var(--brand-900) 100%);
  }

  /* Gold accent strip */
  .form-header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-light), var(--gold-dark));
  }

  .form-header h1 {
    margin: 0 0 .5rem;
    font-size: clamp(1.45rem, 3vw, 1.9rem);
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1.25;
    color: #ffffff;           /* solid, high-contrast — no gradient text */
  }

  .form-subtitle {
    margin: 0 0 1.5rem;
    font-size: .9375rem;
    line-height: 1.55;
    color: rgba(255, 255, 255, .8);
  }

  /* Progress bar */
  .progress-bar-container {
    height: 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .18);
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width .45s cubic-bezier(.16, 1, .3, 1);
  }

  /* Step badge */
  .step-indicator {
    display: inline-block;
    margin-top: .875rem;
    padding: .35rem .9rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .22);
    font-size: .8125rem;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--gold-light);
  }

  /* ============================================================
     BODY
     ============================================================ */
  .form-body {
    padding: 2.25rem 2.5rem 2.5rem;
    background: var(--surface);
  }

  /* ============================================================
     STEPS
     ============================================================ */
  .form-step { display: none; }

  .form-step.active {
    display: block;
    animation: stepIn .35s cubic-bezier(.16, 1, .3, 1) both;
  }

  .form-step.leaving {
    display: block;
    animation: stepOut .25s ease both;
  }

  @keyframes stepIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes stepOut {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-6px); }
  }

  /* ============================================================
     QUESTION BLOCKS
     ============================================================ */
  .question-block {
    padding: 1.375rem 1.5rem;
    margin-bottom: 1.25rem;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }

  .question-block:hover {
    background: var(--surface);
    border-color: var(--line-strong);
  }

  .question-block:focus-within {
    background: var(--surface);
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(212, 175, 55, .16);
  }

  /* ============================================================
     LABELS
     ============================================================ */
  label {
    display: block;
    margin-bottom: .5rem;
    font-size: .9375rem;
    font-weight: 600;
    line-height: 1.45;
    color: var(--ink);
  }

  /* ============================================================
     INPUTS
     ============================================================ */
  .form-control,
  .form-select {
    width: 100%;
    padding: .75rem .9375rem;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--ink);
    background-color: var(--surface);
    border: 1.5px solid var(--line-strong);
    border-radius: var(--r-md);
    transition: border-color .18s ease, box-shadow .18s ease;
  }

  .form-control:focus,
  .form-select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(212, 175, 55, .18);
    background-color: var(--surface);
  }

  .form-control::placeholder { color: var(--muted-2); }

  .form-control:disabled,
  .form-select:disabled {
    background-color: #f1f5f9;
    color: var(--muted);
    cursor: not-allowed;
  }

  /* Checkboxes / radios */
  .form-check-input {
    width: 1.15em;
    height: 1.15em;
    margin-top: .18em;
    accent-color: var(--brand-700);
    cursor: pointer;
  }

  .form-check-label {
    font-weight: 500;
    color: var(--ink-2);
    cursor: pointer;
  }

  /* ============================================================
     HELP + ERROR TEXT
     ============================================================ */
  .form-text {
    display: block;
    margin-top: .5rem;
    font-size: .8125rem;
    line-height: 1.55;
    color: var(--muted);
  }

  .text-danger {
    margin-top: .4rem;
    font-size: .8125rem;
    font-weight: 500;
    color: var(--danger);
  }

  /* ============================================================
     AMENITY / PAYMENT GRID
     ============================================================ */
  .amenities-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: .875rem;
    margin-top: 1.25rem;
  }

  .amenity-item {
    position: relative;
    display: flex;
    align-items: center;
    padding: 1rem 1.125rem;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--r-lg);
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease,
                box-shadow .18s ease, transform .18s ease;
  }

  .amenity-item:hover {
    border-color: var(--gold);
    transform: translateY(-1px);
    box-shadow: var(--sh-md);
  }

  .amenity-item:has(input[type="checkbox"]:checked),
  .amenity-item:has(input[type="radio"]:checked) {
    border-color: var(--gold);
    background: var(--gold-tint);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, .14);
  }

  .amenity-item label {
    display: flex;
    align-items: center;
    gap: .75rem;
    width: 100%;
    margin: 0;
    padding: 0;
    font-size: .9375rem;
    font-weight: 500;
    color: var(--ink-2);
    cursor: pointer;
  }

  .amenity-item input[type="checkbox"],
  .amenity-item input[type="radio"] {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: var(--brand-700);
    cursor: pointer;
  }

  /* ============================================================
     NAVIGATION BUTTONS
     ============================================================ */
  .btn-group-nav {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    padding-top: 1.75rem;
    border-top: 1px solid var(--line);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    padding: .875rem 1.75rem;
    font-family: inherit;
    font-size: .9375rem;
    font-weight: 600;
    letter-spacing: .01em;
    line-height: 1.2;
    color: #fff;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease,
                box-shadow .18s ease, transform .18s ease, color .18s ease;
  }

  .btn-next,
  .btn-submit {
    flex: 1;
    background: var(--brand-700);
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(30, 58, 95, .25);
  }

  .btn-next:hover,
  .btn-submit:hover {
    background: var(--brand-800);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(30, 58, 95, .3);
  }

  .btn-next:active,
  .btn-submit:active {
    transform: translateY(0);
    box-shadow: 0 2px 6px rgba(30, 58, 95, .25);
  }

  .btn-prev {
    background: var(--surface);
    color: var(--ink-2);
    border-color: var(--line-strong);
  }

  .btn-prev:hover {
    background: var(--surface-2);
    border-color: var(--muted-2);
    color: var(--ink);
  }

  .btn:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  /* ============================================================
     MOTION / RESPONSIVE
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    .form-step.active,
    .form-step.leaving { animation: none; }

    .form-container,
    .question-block,
    .amenity-item,
    .btn,
    .progress-bar-fill { transition: none; }
  }

  @media (max-width: 640px) {
    body { padding: 1.25rem .75rem 3rem; }

    .form-header { padding: 1.75rem 1.25rem 1.5rem; }
    .form-body   { padding: 1.5rem 1.25rem 2rem; }

    .question-block { padding: 1.125rem 1rem; }

    .amenities-grid { grid-template-columns: 1fr; }

    .btn-group-nav { flex-direction: column-reverse; }
    .btn { width: 100%; }
  }
</style>

<div class="form-container">
  <div class="form-header">
    <h1>Register Your Establishment</h1>
    <p class="form-subtitle">Complete the steps below — it only takes a few minutes.</p>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="step-indicator" id="stepIndicator"></div>
  </div>

  <div class="form-body">
    <form method="post" action="{% url 'resorts:registerResort' %}" id="resortForm">
      {% csrf_token %}

      <div id="formStepsContainer"></div>

      <div class="btn-group-nav">
        <button type="button" class="btn btn-prev" id="prevBtn" onclick="changeStep(-1)" style="display: none;">Previous</button>
        <button type="button" class="btn btn-next" id="nextBtn" onclick="changeStep(1)">Next</button>
        <button type="submit" class="btn btn-submit" id="submitBtn" style="display: none;">Submit</button>
      </div>
    </form>
  </div>
</div>

<script>
  let currentStep = 0;
  let formSteps = [];

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function formatTimeTo12h(timeValue) {
    // timeValue is usually "HH:MM" from <input type="time">
    if (!timeValue || typeof timeValue !== 'string' || !timeValue.includes(':')) return '';
    const [hhStr, mmStr] = timeValue.split(':');
    const hh = parseInt(hhStr, 10);
    const mm = parseInt(mmStr, 10);
    if (!Number.isFinite(hh) || !Number.isFinite(mm)) return '';
    const period = hh >= 12 ? 'PM' : 'AM';
    const hour12 = ((hh + 11) % 12) + 1;
    return `${hour12}:${pad2(mm)} ${period}`;
  }

  function buildOpenHoursText({ isClosed, is247, dayPattern, startTime, endTime }) {
    if (isClosed) return 'Temporarily closed';
    if (is247) return 'Open 24/7';
    const start = formatTimeTo12h(startTime);
    const end = formatTimeTo12h(endTime);
    if (!dayPattern || !start || !end) return '';
    return `${dayPattern} ${start} – ${end}`;
  }

  function initOpenHoursBuilder(questionBlock) {
    const rawInput = questionBlock.querySelector('#id_open_hours');
    if (!rawInput) return;

    const manualInput = questionBlock.querySelector('#openHoursManualInput');

    const builderToggle = questionBlock.querySelector('#openHoursUseBuilder');
    const builderPanel = questionBlock.querySelector('#openHoursBuilderPanel');
    const rawPanel = questionBlock.querySelector('#openHoursRawPanel');
    const preview = questionBlock.querySelector('#openHoursPreview');

    const closedEl = questionBlock.querySelector('#openHoursClosed');
    const is247El = questionBlock.querySelector('#openHours247');
    const dayPatternEl = questionBlock.querySelector('#openHoursDayPattern');
    const startEl = questionBlock.querySelector('#openHoursStart');
    const endEl = questionBlock.querySelector('#openHoursEnd');

    function setMode(useBuilder) {
      if (builderPanel) builderPanel.style.display = useBuilder ? 'block' : 'none';
      if (rawPanel) rawPanel.style.display = useBuilder ? 'none' : 'block';
      if (builderToggle) builderToggle.checked = useBuilder;
      if (manualInput) {
        manualInput.value = rawInput.value || '';
        manualInput.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }

    function syncFromBuilder() {
      const text = buildOpenHoursText({
        isClosed: !!(closedEl && closedEl.checked),
        is247: !!(is247El && is247El.checked),
        dayPattern: dayPatternEl ? dayPatternEl.value : '',
        startTime: startEl ? startEl.value : '',
        endTime: endEl ? endEl.value : '',
      });

      if (text) {
        rawInput.value = text;
        rawInput.dispatchEvent(new Event('input', { bubbles: true }));
        rawInput.dispatchEvent(new Event('change', { bubbles: true }));
      }

      if (preview) {
        preview.textContent = text ? `Preview: ${text}` : 'Preview: (fill options above)';
      }

      // Disable/enable fields depending on toggles
      const disableTime = !!(is247El && is247El.checked) || !!(closedEl && closedEl.checked);
      if (dayPatternEl) dayPatternEl.disabled = disableTime;
      if (startEl) startEl.disabled = disableTime;
      if (endEl) endEl.disabled = disableTime;
    }

    function defaultBuilderIfEmpty() {
      const hasText = String(rawInput.value || '').trim().length > 0;
      setMode(!hasText);
      syncFromBuilder();
    }

    if (manualInput) {
      manualInput.addEventListener('input', () => {
        rawInput.value = manualInput.value;
        rawInput.dispatchEvent(new Event('input', { bubbles: true }));
        rawInput.dispatchEvent(new Event('change', { bubbles: true }));
        if (preview) {
          const t = String(manualInput.value || '').trim();
          preview.textContent = t ? `Preview: ${t}` : 'Preview: (type open hours)';
        }
      });
    }

    if (builderToggle) {
      builderToggle.addEventListener('change', () => {
        setMode(builderToggle.checked);
        if (builderToggle.checked) syncFromBuilder();
      });
    }

    [closedEl, is247El, dayPatternEl, startEl, endEl].forEach((el) => {
      if (!el) return;
      el.addEventListener('change', syncFromBuilder);
      el.addEventListener('input', syncFromBuilder);
    });

    defaultBuilderIfEmpty();
  }

  function initializeForm() {
    const formFields = [];
    const amenityFields = [];
    const paymentFields = [];

    {% for field in RESORTFORM %}
      {% if 'accepts_' in field.name %}
        paymentFields.push({
          name: '{{ field.name }}',
          label: '{{ field.label }}',
          html: `{{ field|safe }}`
        });
      {% elif 'has_' in field.name or 'pet_friendly' in field.name or 'family_friendly' in field.name %}
        amenityFields.push({
          name: '{{ field.name }}',
          label: '{{ field.label }}',
          html: `{{ field|safe }}`
        });
      {% else %}
        formFields.push({
          name: '{{ field.name }}',
          label: '{{ field.label }}',
          html: `{{ field|safe }}`,
          helpText: '{{ field.help_text|safe }}',
          errors: '{{ field.errors|safe }}'
        });
      {% endif %}
    {% endfor %}

    // Ensure latitude + longitude are always on the same step
    let latField = null;
    let lngField = null;
    const remainingFields = [];
    formFields.forEach((f) => {
      if (!f) return;
      if (f.name === 'latitude') {
        latField = f;
        return;
      }
      if (f.name === 'longitude') {
        lngField = f;
        return;
      }
      remainingFields.push(f);
    });

    // Create steps with 2 questions each (from remaining fields)
    for (let i = 0; i < remainingFields.length; i += 2) {
      const stepFields = remainingFields.slice(i, i + 2);
      formSteps.push({ type: 'fields', fields: stepFields });
    }

    // Add coordinates step (lat/lng) as its own step
    if (latField && lngField) {
      formSteps.push({ type: 'fields', fields: [latField, lngField] });
    } else {
      // If only one exists for some reason, keep it in the normal flow
      if (latField) formSteps.push({ type: 'fields', fields: [latField] });
      if (lngField) formSteps.push({ type: 'fields', fields: [lngField] });
    }

    // Add amenities as penultimate step
    if (amenityFields.length > 0) {
      formSteps.push({ type: 'amenities', fields: amenityFields });
    }

    // Add payment methods as final step
    if (paymentFields.length > 0) {
      formSteps.push({ type: 'payments', fields: paymentFields });
    }

    renderSteps();
    showStep(0);
  }

  function renderSteps() {
    const container = document.getElementById('formStepsContainer');
    container.innerHTML = '';

    formSteps.forEach((step, index) => {
      const stepDiv = document.createElement('div');
      stepDiv.className = 'form-step';
      stepDiv.setAttribute('data-step', index);

      if (step.type === 'fields') {
        const isFirstStep = index === 0;

        // Put the location helper at the top of the first field section.
        if (isFirstStep) {
          const geoBlock = document.createElement('div');
          geoBlock.className = 'question-block';
          geoBlock.innerHTML = `
            <label>Auto-fill Address</label>
            <div class="d-flex gap-2 flex-wrap align-items-center">
              <button type="button" class="btn btn-prev" id="useGeolocationBtn" style="padding: .625rem 1rem;">Use my current location</button>
              <small class="form-text" style="margin-top: 0;" id="geoStatus"></small>
            </div>
            <small class="form-text">This asks for browser location permission and fills the address based on your current location.</small>
          `;
          stepDiv.appendChild(geoBlock);

          setTimeout(() => {
            const btn = document.getElementById('useGeolocationBtn');
            if (btn) btn.addEventListener('click', fillFromGeolocation);
          }, 0);
        }

        step.fields.forEach(field => {
          const questionBlock = document.createElement('div');
          questionBlock.className = 'question-block';
          if (field.name === 'open_hours') {
            questionBlock.innerHTML = `
              <label>${field.label}</label>
              <div class="d-flex gap-2 flex-wrap align-items-center" style="margin-bottom: .75rem;">
                <div class="form-check" style="margin: 0;">
                  <input class="form-check-input" type="checkbox" id="openHoursUseBuilder" checked>
                  <label class="form-check-label" for="openHoursUseBuilder">Quick builder</label>
                </div>
                <small class="form-text" style="margin: 0;">Generates a clean text like “Mon–Sun 8:00 AM – 9:00 PM”.</small>
              </div>

              <div id="openHoursBuilderPanel">
                <div class="d-flex gap-3 flex-wrap">
                  <div class="form-check" style="margin: 0;">
                    <input class="form-check-input" type="checkbox" id="openHours247">
                    <label class="form-check-label" for="openHours247">Open 24/7</label>
                  </div>
                  <div class="form-check" style="margin: 0;">
                    <input class="form-check-input" type="checkbox" id="openHoursClosed">
                    <label class="form-check-label" for="openHoursClosed">Temporarily closed</label>
                  </div>
                </div>

                <div class="d-flex gap-2 flex-wrap" style="margin-top: .875rem;">
                  <select class="form-select" id="openHoursDayPattern" style="max-width: 260px;">
                    <option value="Mon–Sun">Mon–Sun (daily)</option>
                    <option value="Mon–Fri">Mon–Fri</option>
                    <option value="Mon–Sat">Mon–Sat</option>
                    <option value="Sat–Sun">Sat–Sun (weekends)</option>
                  </select>
                  <input type="time" class="form-control" id="openHoursStart" style="max-width: 170px;" value="08:00">
                  <input type="time" class="form-control" id="openHoursEnd" style="max-width: 170px;" value="21:00">
                </div>

                <small class="form-text" id="openHoursPreview" style="margin-top: .625rem;">Preview: (fill options above)</small>
              </div>

              <div id="openHoursRawPanel" style="display:none;">
                <input type="text" class="form-control" id="openHoursManualInput" placeholder="Mon–Sun 8:00 AM – 9:00 PM">
                ${field.helpText ? `<small class="form-text">${field.helpText}</small>` : ''}
                <small class="form-text">Tip: You can type “Daily 8am–9pm” or “Mon–Fri 9–5, Sat 9–12”.</small>
              </div>

              <!-- Always keep the real form field present for submission -->
              <div style="display:none;">${field.html}</div>
              ${field.errors ? `<div class="text-danger">${field.errors}</div>` : ''}
            `;
          } else {
            questionBlock.innerHTML = `
              <label>${field.label}</label>
              ${field.html}
              ${field.helpText ? `<small class="form-text">${field.helpText}</small>` : ''}
              ${field.errors ? `<div class="text-danger">${field.errors}</div>` : ''}
            `;
          }
          stepDiv.appendChild(questionBlock);

          if (field.name === 'open_hours') {
            setTimeout(() => initOpenHoursBuilder(questionBlock), 0);
          }
        });
      } else if (step.type === 'amenities') {
        const amenitiesSection = document.createElement('div');
        amenitiesSection.className = 'question-block';
        amenitiesSection.innerHTML = '<label style="font-size: 1.125rem; text-align: center; margin-bottom: 0;">🏖️ Establishment Amenities &amp; Features</label><small class="form-text" style="text-align:center;">Tap each item you offer.</small>';

        const amenitiesGrid = document.createElement('div');
        amenitiesGrid.className = 'amenities-grid';

        step.fields.forEach(field => {
          // Extract input from field.html, ignore any label in field.html
          const parser = document.createElement('div');
          parser.innerHTML = field.html;
          const input = parser.querySelector('input');
          if (input) {
            // Remove input from parser so we don't duplicate
            parser.removeChild(input);
          }
          const amenityDiv = document.createElement('div');
          amenityDiv.className = 'amenity-item';
          amenityDiv.innerHTML = `
            <label>
              ${input ? input.outerHTML : ''}
              <span>${field.label}</span>
            </label>
          `;
          amenitiesGrid.appendChild(amenityDiv);
        });

        amenitiesSection.appendChild(amenitiesGrid);
        stepDiv.appendChild(amenitiesSection);
      } else if (step.type === 'payments') {
        const paymentsSection = document.createElement('div');
        paymentsSection.className = 'question-block';
        paymentsSection.innerHTML = '<label style="font-size: 1.125rem; text-align: center; margin-bottom: 0;">💳 Payment Methods Accepted</label><small class="form-text" style="text-align:center;">Tap each method you accept.</small>';

        const paymentsGrid = document.createElement('div');
        paymentsGrid.className = 'amenities-grid';

        step.fields.forEach(field => {
          const parser = document.createElement('div');
          parser.innerHTML = field.html;
          const input = parser.querySelector('input');
          if (input) parser.removeChild(input);

          const paymentDiv = document.createElement('div');
          paymentDiv.className = 'amenity-item';
          paymentDiv.innerHTML = `
            <label>
              ${input ? input.outerHTML : ''}
              <span>${field.label}</span>
            </label>
          `;

          paymentsGrid.appendChild(paymentDiv);
        });

        paymentsSection.appendChild(paymentsGrid);
        stepDiv.appendChild(paymentsSection);
      }

      container.appendChild(stepDiv);
    });
  }

  function showStep(step, fromStep = null) {
    const steps = document.querySelectorAll('.form-step');

    const prevStep = typeof fromStep === 'number' ? fromStep : step;

    // Animate previous step out (if any)
    const prevEl = steps[prevStep];
    if (prevEl && prevStep !== step) {
      prevEl.classList.remove('active');
      prevEl.classList.add('leaving');
      setTimeout(() => {
        prevEl.classList.remove('leaving');
        // Keep it hidden once it has animated out
        prevEl.style.display = 'none';
      }, 280);
    }

    // Hide all non-target steps immediately (except leaving)
    steps.forEach((stepEl, index) => {
      if (index !== step && index !== prevStep) {
        stepEl.classList.remove('active', 'leaving');
        stepEl.style.display = 'none';
      }
    });

    // Animate target step in
    const nextEl = steps[step];
    if (nextEl) {
      nextEl.style.display = 'block';
      nextEl.classList.remove('leaving');
      setTimeout(() => {
        nextEl.classList.add('active');
      }, 30);
    }

    // Update buttons
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');

    prevBtn.style.display = step === 0 ? 'none' : 'inline-flex';

    if (step === formSteps.length - 1) {
      nextBtn.style.display = 'none';
      submitBtn.style.display = 'inline-flex';
    } else {
      nextBtn.style.display = 'inline-flex';
      submitBtn.style.display = 'none';
    }

    // Update progress bar
    const progress = ((step + 1) / formSteps.length) * 100;
    document.getElementById('progressBar').style.width = progress + '%';

    // Update "Step X of Y" indicator
    const stepIndicator = document.getElementById('stepIndicator');
    if (stepIndicator) {
      stepIndicator.textContent = `Step ${step + 1} of ${formSteps.length}`;
    }

    // Gentle nudge back to top of the card on step change
    const container = document.querySelector('.form-container');
    if (container) {
      container.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function changeStep(direction) {
    const newStep = currentStep + direction;

    if (newStep >= 0 && newStep < formSteps.length) {
      const prev = currentStep;
      currentStep = newStep;
      showStep(currentStep, prev);
    }
  }

  function setInputValueById(id, value) {
    const input = document.getElementById(id);
    if (!input) return false;
    let nextValue = String(value || '');
    if (typeof input.maxLength === 'number' && input.maxLength > 0 && nextValue.length > input.maxLength) {
      nextValue = nextValue.slice(0, input.maxLength);
    }
    input.value = nextValue;
    dispatchFormEvents(input);
    return true;
  }

  function dispatchFormEvents(input) {
    if (!input) return;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function setGeoStatus(message, isError = false) {
    const statusEl = document.getElementById('geoStatus');
    if (!statusEl) return;
    statusEl.textContent = message || '';
    statusEl.style.color = isError ? '#dc2626' : '#64748b';
  }

  function normalizeLocationText(value) {
    return String(value || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  function compactUniqueParts(parts) {
    const seen = new Set();
    return parts
      .map(part => String(part || '').trim())
      .filter(part => {
        const key = normalizeLocationText(part);
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
  }

  function firstText() {
    for (let i = 0; i < arguments.length; i += 1) {
      const value = String(arguments[i] || '').trim();
      if (value) return value;
    }
    return '';
  }

  function getProvinceFromGeocode(data) {
    const address = data && data.address ? data.address : {};
    return firstText(address.province, address.state, address.region, address.county, address.state_district);
  }

  function buildAddressTextFromGeocode(data) {
    const address = data && data.address ? data.address : {};
    const street = address.house_number && address.road ? `${address.house_number} ${address.road}` : address.road;
    const locality = firstText(address.city, address.town, address.village, address.municipality);
    const parts = compactUniqueParts([
      street,
      address.neighbourhood,
      address.suburb,
      address.quarter,
      address.hamlet,
      locality,
      address.county,
      getProvinceFromGeocode(data),
      address.country
    ]);

    return parts.join(', ') || firstText(data && data.display_name);
  }

  function getPlaceCandidatesFromGeocode(data) {
    const address = data && data.address ? data.address : {};
    return compactUniqueParts([
      data && data.name,
      address.city,
      address.town,
      address.village,
      address.municipality,
      address.island,
      address.suburb,
      address.neighbourhood,
      address.county,
      address.province,
      address.state
    ]);
  }

  function setPlaceFieldFromCandidates(candidates) {
    const field = document.getElementById('id_place');
    const normalizedCandidates = compactUniqueParts(candidates).map(normalizeLocationText).filter(Boolean);
    if (!field || normalizedCandidates.length === 0) return false;

    if (field.tagName && field.tagName.toLowerCase() === 'select') {
      const options = Array.from(field.options || []).filter(option => String(option.value || '').trim() !== '');
      let matchedOption = options.find(option => {
        const text = normalizeLocationText(option.textContent);
        const value = normalizeLocationText(option.value);
        return normalizedCandidates.includes(text) || normalizedCandidates.includes(value);
      });

      if (!matchedOption) {
        matchedOption = options.find(option => {
          const text = normalizeLocationText(option.textContent);
          return normalizedCandidates.some(candidate => text && candidate && (text.includes(candidate) || candidate.includes(text)));
        });
      }

      if (!matchedOption) return false;
      field.value = matchedOption.value;
      dispatchFormEvents(field);
      return true;
    }

    return setInputValueById('id_place', candidates[0]);
  }

  async function reverseGeocodeCoordinates(lat, lng) {
    const url = new URL('https://nominatim.openstreetmap.org/reverse');
    url.searchParams.set('format', 'jsonv2');
    url.searchParams.set('lat', lat);
    url.searchParams.set('lon', lng);
    url.searchParams.set('zoom', '18');
    url.searchParams.set('addressdetails', '1');

    const response = await fetch(url.toString(), {
      headers: {
        'Accept': 'application/json'
      }
    });

    if (!response.ok) {
      throw new Error('Reverse geocoding failed');
    }

    return response.json();
  }

  async function fillAddressFieldsFromCoordinates(lat, lng) {
    setGeoStatus('Coordinates filled. Looking up address...');

    try {
      const data = await reverseGeocodeCoordinates(lat, lng);
      const updatedFields = [];
      const province = getProvinceFromGeocode(data);
      const addressText = buildAddressTextFromGeocode(data);
      const placeCandidates = getPlaceCandidatesFromGeocode(data);

      if (province && setInputValueById('id_province', province)) updatedFields.push('province');
      if (addressText && setInputValueById('id_address', addressText)) updatedFields.push('address');
      if (setPlaceFieldFromCandidates(placeCandidates)) updatedFields.push('place');

      if (updatedFields.length > 0) {
        setGeoStatus(`Location filled. Updated ${updatedFields.join(', ')}.`);
      } else {
        setGeoStatus('Coordinates filled. Choose province, place, and address manually if needed.');
      }
    } catch (error) {
      setGeoStatus('Coordinates filled, but address lookup was unavailable. Please add province/address manually.');
    }
  }

  function fillFromGeolocation() {
    const btn = document.getElementById('useGeolocationBtn');
    if (!navigator.geolocation) {
      setGeoStatus('Geolocation is not supported in this browser.', true);
      return;
    }

    if (btn) btn.disabled = true;
    setGeoStatus('Requesting current location…');

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        const latOk = setInputValueById('id_latitude', lat.toFixed(6));
        const lngOk = setInputValueById('id_longitude', lng.toFixed(6));

        try {
          if (latOk && lngOk) {
            await fillAddressFieldsFromCoordinates(lat.toFixed(6), lng.toFixed(6));
          } else {
            setGeoStatus('Could not find latitude/longitude inputs on the page.', true);
          }

        } finally {
          if (btn) btn.disabled = false;
        }

      },
      (err) => {
        let msg = 'Unable to get your location.';
        if (err && typeof err.code === 'number') {
          if (err.code === 1) msg = 'Permission denied. Please allow location access and try again.';
          if (err.code === 2) msg = 'Location unavailable. Try again outdoors or with better signal.';
          if (err.code === 3) msg = 'Location request timed out. Please try again.';
        }
        setGeoStatus(msg, true);
        if (btn) btn.disabled = false;
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  }

  // Initialize when DOM is ready
  document.addEventListener('DOMContentLoaded', function() {
    initializeForm();
  });
</script>
