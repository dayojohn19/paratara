<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password Reset</title>
</head>
<body style="margin:0; padding:24px; background:#f5f7fa; font-family:Segoe UI, Arial, sans-serif; color:#1f2937;">
  <table role="presentation" cellpadding="0" cellspacing="0" style="max-width:560px; margin:0 auto; width:100%; background:#ffffff; border:1px solid #dbe2ea; border-radius:12px;">
    <tr>
      <td style="padding:24px;">
        <p style="margin:0 0 12px;">Hi,</p>
        <p style="margin:0 0 12px;">We received a request to reset your password.</p>
        <p style="margin:0 0 16px;">Use the button below to continue:</p>
        <p style="margin:0 0 16px;">
          <a href="{{ link }}" style="display:inline-block; background:#0d6efd; color:#ffffff; text-decoration:none; padding:10px 14px; border-radius:8px;">Reset Password</a>
        </p>
        <p style="margin:0 0 8px; font-size:13px; color:#6b7280; word-break:break-all;">
          If the button does not work, open this link:<br>
          <a href="{{ link }}" style="color:#0d6efd;">{{ link }}</a>
        </p>
        <p style="margin:16px 0 0; font-size:13px; color:#6b7280;">If you did not request this, you can safely ignore this email.</p>
      </td>
    </tr>
  </table>
</body>
</html>
