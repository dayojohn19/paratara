{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="{% static 'bootstrap/css/master.css' %}" />
  <style>
    :root {
      --surface: #ffffff;
      --line: #dbe2ea;
      --text: #1f2937;
      --bg: #f3f5f8;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    .reset-shell {
      max-width: 460px;
      margin: 3rem auto;
      padding: 1rem;
    }

    .reset-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      padding: 1.4rem;
    }
  </style>
</head>
<body>
  <div class="reset-shell">
    <div class="reset-card">
      <h1 class="fw-bold mb-3 fs-3">Reset Password</h1>
      {% if message %}
      <p class="text-danger">{{ message }}</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-floating mb-3">
          <input id="newPasswordInput" required class="form-control" type="password" name="newPassword" placeholder="New Password" />
          <label for="newPasswordInput">New Password</label>
        </div>
        <div class="form-floating mb-3">
          <input id="newPasswordConfirmInput" required class="form-control" type="password" name="newPasswordConfirmation" placeholder="Confirm New Password" />
          <label for="newPasswordConfirmInput">Confirm New Password</label>
        </div>
        <button class="w-100 btn btn-primary" type="submit">Update Password</button>
      </form>
    </div>
  </div>
</body>
</html>
