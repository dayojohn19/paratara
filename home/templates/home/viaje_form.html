<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Place Schedule</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --border: #d8e0ec;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #b91c1c;
      --success: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: 32px auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }

    .intro {
      margin: 0 0 24px;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 18px;
    }

    fieldset {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    legend {
      padding: 0 8px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 700;
      color: #243047;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 11px 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .radio-row,
    .date-row,
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .radio-option {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-weight: 600;
      background: #fff;
    }

    .radio-option input {
      width: auto;
    }

    .date-row input {
      flex: 1 1 240px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: var(--primary);
      color: #fff;
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #e2e8f0;
      color: #172033;
    }

    .remove-date {
      background: #fee2e2;
      color: var(--danger);
    }

    .status {
      min-height: 24px;
      font-weight: 700;
    }

    .status[data-type="error"] {
      color: var(--danger);
    }

    .status[data-type="success"] {
      color: var(--success);
    }

    .hint {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
    }

    @media (max-width: 680px) {
      main {
        width: min(100% - 20px, 860px);
        margin: 10px auto;
        padding: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Add a Place Schedule</h1>
    <p class="intro">Submit a destination and at least one date. New destinations are created automatically.</p>

    <form id="viajeForm" action="{% url 'home:viaje' %}" method="post">
      {% csrf_token %}

      <fieldset>
        <legend>Destination</legend>
        <div class="grid">
          <label>
            From
            <input name="meetPlace" autocomplete="address-level2" placeholder="Cebu City" required>
          </label>
          <label>
            To
            <input name="placenameschedule" list="placesList" maxlength="32" placeholder="Siargao" required>
          </label>
        </div>
        <datalist id="placesList">
          {% for place in places %}
            <option value="{{ place.placename }}"></option>
          {% endfor %}
        </datalist>
      </fieldset>

      <fieldset>
        <legend>Dates</legend>
        <div id="dateList">
          <div class="date-row">
            <input type="datetime-local" name="meetDate" required>
            <button type="button" class="secondary" id="addDateButton">Add date</button>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Schedule</legend>
        <div class="radio-row" aria-label="Schedule intention">
          <label class="radio-option">
            <input type="radio" name="MakerOrLooker" value="Find" checked required>
            Looking
          </label>
          <label class="radio-option">
            <input type="radio" name="MakerOrLooker" value="Make" required>
            Creating
          </label>
        </div>

        <div class="grid">
          <label>
            Travel type
            <select name="scheduleTravelType" id="scheduleTravelType">
              <option value="RIDE" selected>Car Pool</option>
              <option value="BIKE">Bike</option>
              <option value="HIKE">Hike</option>
              <option value="DIVE">Dive</option>
              <option value="CAMP">Camp</option>
            </select>
          </label>
          <label>
            Mode
            <select name="scheduleTypeAndMode" id="scheduleTypeAndMode" required>
              <option value="Passenger" selected>Passenger</option>
              <option value="Driver">Driver</option>
              <option value="Joiner">Joiner</option>
              <option value="Organizer">Organizer</option>
            </select>
          </label>
        </div>

        <div class="grid">
          <label>
            Budget
            <input name="scheduleCost" placeholder="Optional">
          </label>
          <label>
            Contact
            <input name="detailsContact" value="{{ request.user.email }}" autocomplete="email" placeholder="Phone, Messenger, or email" required>
          </label>
        </div>

        <label>
          Details
          <textarea name="theDetails" placeholder="What should other travelers know?"></textarea>
        </label>

        <label>
          Additional details
          <textarea name="additionalDetails" placeholder="Optional notes"></textarea>
        </label>

        <label>
          Website
          <input name="scheduleWebsite" type="url" placeholder="https://example.com">
          <span class="hint">Optional</span>
        </label>
      </fieldset>

      <div class="actions">
        <button type="submit" class="primary" id="submitButton">Submit</button>
        <a href="{% url 'home:home' %}">Back home</a>
      </div>
      <div class="status" id="formStatus" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('viajeForm');
    const statusEl = document.getElementById('formStatus');
    const submitButton = document.getElementById('submitButton');
    const dateList = document.getElementById('dateList');
    const addDateButton = document.getElementById('addDateButton');

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.dataset.type = type || '';
    }

    addDateButton.addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'date-row';
      row.innerHTML = `
        <input type="datetime-local" name="meetDate" required>
        <button type="button" class="remove-date">Remove</button>
      `;
      row.querySelector('button').addEventListener('click', () => row.remove());
      dateList.appendChild(row);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      setStatus('Submitting...', '');
      submitButton.disabled = true;

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          credentials: 'same-origin',
        });

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        setStatus('Created. Opening the place page...', 'success');
        window.location.href = response.url || '{% url "home:home" %}';
      } catch (error) {
        setStatus(error.message, 'error');
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
